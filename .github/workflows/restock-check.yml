name: FirstCry Restock Bot

# Runs automatically every 15 minutes, forever, in GitHub's cloud.
# You can also trigger it manually from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Needed so the workflow can commit the updated state file back to the repo.
permissions:
  contents: write

jobs:
  check-restock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run restock check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python firstcry_restock_bot.py

      # The bot writes firstcry_restock_state.json to remember what was
      # out of stock last run. Commit it back so the NEXT run (a fresh
      # container) can compare against it and detect restocks.
      - name: Save updated state back to the repo
        run: |
          git config user.name "firstcry-restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add firstcry_restock_state.json
          git diff --cached --quiet || git commit -m "Update restock state [skip ci]"
          git push
